<title>브레아노 AI 비서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@700&display=swap">
<!--
  브레아노 AI 비서 v2 — 프랜차이즈 운영 시스템
  · 링크 하나를 지점 원장님들께 '참여자'로 공유하면, 각 지점은 자기 데이터(상담·재원생·콘텐츠)를 비공개로 씁니다.
  · 브랜드 표준은 본사(소유자·편집자)만 고치고 모든 지점의 AI 글에 똑같이 적용됩니다.
  · 지점이 '본사에 보고'를 누르면 집계 숫자만 본사로 갑니다 (아이 정보는 가지 않음).
-->
<style>
/* Layout: 모바일 앱 — 상단 브랜드 띠(건반) / 탭별 스크롤 화면 / 하단 탭바(비서 탭에서는 입력창이 위에 붙음) */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16202E; --muted:#5D6878; --line:#D6DCE3;
  --brand:#23395B; --brand-ink:#FFFFFF; --accent:#C2873A;
  --chip:#E4E9F0; --chip-ink:#23395B; --user:#23395B; --user-ink:#FFFFFF;
  --ok:#2F7A55; --ok-bg:#E2F1E8; --warn:#A35A1F; --warn-bg:#F8EBDD; --bad:#B23B3B; --bad-bg:#F8E1E1;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151E; --surface:#18212D; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2A3544;
  --brand:#1B2C47; --brand-ink:#F1F4F8; --accent:#D9A15A; --chip:#223047; --chip-ink:#D7E2F2;
  --user:#355483; --user-ink:#FFFFFF; --ok:#6BC59A; --ok-bg:#16352A; --warn:#E3A266; --warn-bg:#3A2A18; --bad:#EE8A8A; --bad-bg:#3E1E22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#18212D; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2A3544;
  --brand:#1B2C47; --brand-ink:#F1F4F8; --accent:#D9A15A; --chip:#223047; --chip-ink:#D7E2F2;
  --user:#355483; --user-ink:#FFFFFF; --ok:#6BC59A; --ok-bg:#16352A; --warn:#E3A266; --warn-bg:#3A2A18; --bad:#EE8A8A; --bad-bg:#3E1E22; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  word-break:keep-all;overflow-wrap:anywhere;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:780px;margin:0 auto;width:100%}

header{background:var(--brand);color:var(--brand-ink)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.kicker{font-size:12.5px;opacity:.8;letter-spacing:.03em}
h1{font-family:var(--f-display);font-size:22px;line-height:1.25;margin:1px 0 0}
.hbtn{background:transparent;border:1px solid color-mix(in srgb,var(--brand-ink) 35%,transparent);color:var(--brand-ink);
  border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.keys{height:9px;background:
  linear-gradient(90deg,transparent 0 9%,var(--ink) 9% 13%,transparent 13% 23%,var(--ink) 23% 27%,transparent 27% 52%,var(--ink) 52% 56%,transparent 56% 66%,var(--ink) 66% 70%,transparent 70% 80%,var(--ink) 80% 84%,transparent 84%) 0 0/84px 5px repeat-x,
  repeating-linear-gradient(90deg,#F7F7F4 0 11px,#C9CED6 11px 12px);border-top:2px solid var(--accent)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.view{display:flex;flex-direction:column;gap:14px;padding-block:16px 28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.sec-h h2{font-size:17px;margin:0}
.sec-h .sub{font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.big-date{font-family:var(--f-display);font-size:20px;margin:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:11.5px;color:var(--muted)}
@media (min-width:640px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}

/* 할 일 */
.todo{display:flex;flex-direction:column;gap:8px}
.ti{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ti .b{flex:1;min-width:0}
.ti .t{font-weight:600}
.ti .d{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;margin-right:4px;white-space:nowrap}
.p-lead{background:var(--chip);color:var(--chip-ink)}
.p-rep{background:var(--ok-bg);color:var(--ok)}
.p-risk{background:var(--bad-bg);color:var(--bad)}
.p-post{background:var(--warn-bg);color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:14px}

/* 버튼 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.wide{width:100%;padding:12px;font-size:15px;font-weight:600;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 폼 */
.form{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
.form label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
details.add>summary{list-style:none;cursor:pointer;font-weight:600;color:var(--brand);padding:2px 0}
:root[data-theme="dark"] details.add>summary{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) details.add>summary{color:var(--accent)}}
details.add>summary::-webkit-details-marker{display:none}
details.add[open]>summary{margin-bottom:10px}

/* 목록 */
.list{display:flex;flex-direction:column;gap:8px}
.li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.li .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.li .who{font-weight:600}
.li .meta{font-size:13px;color:var(--muted)}
.li .ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.li select,.li input[type=date]{width:auto;padding:4px 8px;font-size:13px}
.seg{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:999px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* 비서 */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid color-mix(in srgb,var(--chip-ink) 28%,transparent);background:var(--chip);color:var(--chip-ink);
  border-radius:999px;padding:7px 13px;font-size:14.5px;font-weight:500;line-height:1.3}
.chip:hover{border-color:var(--chip-ink)}
.grp h3{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;margin:14px 0 7px}
.msg{display:flex;flex-direction:column;gap:6px;min-width:0}
.msg.user{align-items:flex-end}
.bubble{max-width:90%;border-radius:var(--r);padding:11px 15px;min-width:0}
.user .bubble{background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px;white-space:pre-wrap}
.bot .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;max-width:100%;width:100%}
.mode-tag{font-size:12px;color:var(--muted)}
.thinking{color:var(--muted);display:flex;align-items:center;gap:8px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:3px;animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.dots span{animation:none;opacity:.7}}
.md{font-size:15px}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md h3{font-size:16.5px;margin:18px 0 7px;color:var(--brand);line-height:1.4}
.md h4{font-size:15px;margin:14px 0 6px}
:root[data-theme="dark"] .md h3{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .md h3{color:var(--accent)}}
.md p{margin:0 0 9px}.md ul,.md ol{margin:0 0 9px;padding-left:22px}.md li{margin:2px 0}
.md blockquote{margin:0 0 9px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0}
.md hr{border:0;border-top:1px dashed var(--line);margin:14px 0}
.md pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap;font-size:13px;margin:0 0 9px}
.md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.md .ph{background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px;padding:0 3px}
.md table{margin:0 0 9px}
.md td,.md th{text-align:left;white-space:normal;vertical-align:top;border:1px solid var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.err{color:var(--bad);font-size:14px}

footer{background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.composer{padding-block:8px 6px}
.mode-bar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-bottom:6px}
.mode-pill{background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:2px 10px;font-weight:600}
.linkish{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;resize:none;border-radius:14px;padding:11px 13px;max-height:38vh;min-height:48px}
.icon-btn{flex-shrink:0;width:44px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:18px}
.icon-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.send{flex-shrink:0;height:48px;padding:0 16px;border-radius:14px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700}
.send[disabled]{opacity:.5}
.attach-row{display:flex;gap:8px;align-items:center;padding-bottom:6px;font-size:13px;color:var(--muted)}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
nav.tabs button{border:0;background:none;padding:7px 2px 8px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button b{font-size:18px;font-weight:400;line-height:1.2}
nav.tabs button.on{color:var(--brand);font-weight:700}
:root[data-theme="dark"] nav.tabs button.on{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button.on{color:var(--accent)}}
nav.tabs .badge{display:inline-block;min-width:16px;height:16px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;line-height:16px;padding:0 4px;margin-left:2px}

.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,15,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:780px;max-height:86vh;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.arch-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.arch-item pre{white-space:pre-wrap;font-family:var(--f-body);font-size:13.5px;margin:4px 0 0;max-height:200px;overflow:auto;background:var(--bg);padding:8px;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px}
</style>

<header>
  <div class="gut"><div class="inner head">
    <div>
      <div class="kicker" id="kicker">세종 브레아노 피아노학원 · 운영 시스템</div>
      <h1>브레아노 AI 비서</h1>
    </div>
    <button class="hbtn" id="btnArchive" type="button">보관함</button>
  </div></div>
  <div class="keys" aria-hidden="true"></div>
</header>

<main id="main">
  <div class="gut"><div class="inner">
    <section class="view" id="v-today"></section>
    <section class="view" id="v-chat" hidden></section>
    <section class="view" id="v-leads" hidden></section>
    <section class="view" id="v-students" hidden></section>
    <section class="view" id="v-hq" hidden></section>
  </div></div>
</main>

<footer>
  <div class="gut"><div class="inner composer" id="composer" hidden>
    <div class="mode-bar" id="modeBar" hidden><span>작업:</span><span class="mode-pill" id="modeName"></span><button class="linkish" id="modeClear" type="button">자유 대화로</button></div>
    <div class="attach-row" id="attachRow" hidden><img class="thumb" id="thumb" alt="첨부한 사진"><span>사진 1장 첨부됨</span><button class="linkish" id="attachClear" type="button">빼기</button></div>
    <form class="compose" id="form">
      <button class="icon-btn" id="btnPhoto" type="button" aria-label="사진 올리기" title="사진 올리기" hidden>📷</button>
      <input type="file" id="file" accept="image/*" hidden>
      <button class="icon-btn" id="btnMic" type="button" aria-label="말로 부탁하기" title="말로 부탁하기" hidden>🎙</button>
      <textarea id="input" rows="1" placeholder="예: 겨울방학 특강 홍보글 써줘" aria-label="부탁할 내용"></textarea>
      <button class="send" id="send" type="submit">보내기</button>
    </form>
  </div></div>
  <nav class="tabs gut" id="tabs">
    <button type="button" data-tab="today" class="on"><b>☀︎</b>오늘<span id="todayBadge"></span></button>
    <button type="button" data-tab="chat"><b>✎</b>비서</button>
    <button type="button" data-tab="leads"><b>☏</b>상담</button>
    <button type="button" data-tab="students"><b>♪</b>재원생</button>
    <button type="button" data-tab="hq"><b>⌂</b>본사</button>
  </nav>
</footer>

<div class="sheet-wrap" id="archSheet" hidden>
  <div class="sheet gut" role="dialog" aria-modal="true" aria-labelledby="archTitle"><div class="inner" style="display:grid;gap:10px">
    <h2 id="archTitle">보관함</h2>
    <p class="note">'보관'한 결과가 모여요. 내 지점 계정에 저장돼서 다른 기기에서도 보여요.</p>
    <div id="archList" style="display:grid;gap:8px"></div>
    <div class="row"><button class="btn" id="archClose" type="button">닫기</button></div>
  </div></div>
</div>

<script>
/* =====================================================================
   0. 기본값 — 본사 브랜드 표준 / 지점 정보 카드
   ===================================================================== */
const DEFAULT_STANDARD = `[브레아노 브랜드 표준 — 본사]
핵심 메시지: "피아노를 가르치기 전에, 아이의 성장 엔진을 설계한다"
브랜드 약속: 머리는 명석하고 삶은 행복한 아이 · 원장도 아이도 행복한 브레아노
우리가 파는 것: 피아노가 아니라 아이의 변화 — 집중력, 자신감, 표현력, 끝까지 해내는 힘, 무대 경험
브레아노 방식 (모든 지점 공통):
- 원장 집필 교재의 단계별 기준으로 아이의 현재 수준을 먼저 확인하고 다음 목표를 구체적으로 안내
- 무료 체험 대신 '우리 아이 피아노 시작 진단' + A4 한 장 진단 리포트
- 매주 성장 증거: 짧은 연습 영상 + 성장 리포트 카톡
- 학원 안 작은음악회·연주회로 무대 경험, 희망 시 콩쿠르 도전
- 이론·악보 읽기를 레슨과 함께 — 혼자 악보를 읽는 힘
말투: 따뜻하고 차분하게. 원장 1인칭("저는"), 학부모에게 존댓말. 걱정 공감 → 해결 → 부담 없는 상담 연결
금지 표현: "1:1 맞춤", "기초부터 탄탄", "콩쿠르 전문", "체계적인 커리큘럼", "최고/1등/무조건/100%", 다른 학원 비교·비방, 등록 압박
절대 쓰지 않는 정보: 교습비 금액, 아이 실명·얼굴, 특정 학교 이름, 확인 안 된 숫자·수상 실적
필수: 글마다 지점명 + 지역 키워드, 상담 안내는 '시작 진단'으로`;

const MAIN_BRANCH = `[지점 정보 카드]

   ===================================================================== */
function stats(mk = monthKey()){
  const L = S.leads.filter(l => monthKey(l.createdAt||"") === mk);
  const consults = L.filter(l => ["상담예약","진단완료","보류","등록","미등록"].includes(l.stage)).length;
  const enrolled = S.leads.filter(l => l.stage === "등록" && monthKey(l.enrolledAt||"") === mk).length;
  const active = S.students.filter(s => s.status !== "퇴원").length;
  const left = S.students.filter(s => s.status === "퇴원" && monthKey(s.leftAt||"") === mk).length;
  const byChannel = {};
  L.forEach(l => { const c = l.channel||"기타"; byChannel[c] = byChannel[c] || {leads:0, enrolled:0}; byChannel[c].leads++; if (l.stage==="등록") byChannel[c].enrolled++; });
  const reportsDue = S.students.filter(s => s.status !== "퇴원" && (daysSince(s.lastReport) ?? 99) >= 7).length;
  return { leads:L.length, consults, enrolled, conv: L.length ? Math.round(enrolled/L.length*100) : null,
    active, left, retention: active+left ? Math.round(active/(active+left)*100) : null, byChannel, reportsDue };
}
function todos(){
  const t = today(), out = [];
  S.leads.forEach(l => {
    if (["등록","미등록"].includes(l.stage) || !l.next || l.next > t) return;
    const why = {문의:"첫 응대·상담 예약", 상담예약:"상담 리마인드·준비", 진단완료:"진단 다음 날 연락", 보류:"부드러운 후속 연락"}[l.stage] || "후속 연락";
    out.push({kind:"lead", id:l.id, title:`${l.who} — ${why}`, sub:`${l.stage} · ${l.channel||""}${l.next<t?` · ${daysSince(l.next)}일 지남`:""}`});
  });
  S.students.filter(s => s.status !== "퇴원").forEach(s => {
    if (s.risk === "위험") out.push({kind:"risk", id:s.id, title:`${s.who} — 퇴원 위험, 오늘 연락`, sub:s.memo||"상황을 확인하고 대안을 제안하세요"});
    const d = daysSince(s.lastReport);
    if (d === null || d >= 7) out.push({kind:"rep", id:s.id, title:`${s.who} — 성장 리포트`, sub: d===null ? "아직 보낸 기록 없음" : `${d}일 전에 보냄`});
  });
  S.posts.filter(p => !p.done && p.date <= t).forEach(p => out.push({kind:"post", id:p.id, title:p.title, sub:`${p.channel}${p.date<t?" · 밀린 글":" · 오늘"}`}));
  return out;
}

const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\[(원장님 [^\]]*)\]/g,'<span class="ph">[$1]</span>');
function md(src){
  const lines = src.replace(/\r/g,"").split("\n"); let out=[], list=null, para=[], i=0;
  const fp=()=>{ if(para.length){ out.push("<p>"+para.map(inl).join("<br>")+"</p>"); para=[]; } };
  const fl=()=>{ if(list){ out.push(`<${list.t}>`+list.items.map(x=>"<li>"+x+"</li>").join("")+`</${list.t}>`); list=null; } };
  const li=(t,h)=>{ fp(); if(!list||list.t!==t){ fl(); list={t,items:[]}; } list.items.push(h); };
  while(i<lines.length){
    const l=lines[i]; let m;
    if(/^```/.test(l)){ fp(); fl(); const b=[]; i++; while(i<lines.length && !/^```/.test(lines[i])) b.push(lines[i++]); out.push("<pre><code>"+esc(b.join("\n"))+"</code></pre>"); i++; continue; }
    if(/^\s*$/.test(l)){ fp(); fl(); i++; continue; }
    if((m=l.match(/^#{1,3}\s+(.*)/))){ fp(); fl(); out.push("<h3>"+inl(m[1])+"</h3>"); i++; continue; }
    if((m=l.match(/^#{4,6}\s+(.*)/))){ fp(); fl(); out.push("<h4>"+inl(m[1])+"</h4>"); i++; continue; }
    if(/^(-{3,}|\*{3,})$/.test(l.trim())){ fp(); fl(); out.push("<hr>"); i++; continue; }
    if((m=l.match(/^>\s?(.*)/))){ fp(); fl(); out.push("<blockquote>"+inl(m[1])+"</blockquote>"); i++; continue; }
    if(/^\|.*\|\s*$/.test(l)){ fp(); fl(); const rows=[]; while(i<lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()); const body=rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r.trim()));
      out.push('<div class="tbl-wrap"><table>'+body.map((r,ri)=>"<tr>"+cells(r).map(c=>`<${ri?"td":"th"}>${inl(c)}</${ri?"td":"th"}>`).join("")+"</tr>").join("")+"</table></div>"); continue; }
    if((m=l.match(/^\s*[-*]\s+\[( |x)\]\s+(.*)/i))){ li("ul",(m[1].trim()?"☑ ":"☐ ")+inl(m[2])); i++; continue; }
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){ li("ul",inl(m[1])); i++; continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ li("ol",inl(m[1])); i++; continue; }
    fl(); para.push(l); i++;
  }
  fp(); fl(); return out.join("");
}
const plain = s => s.replace(/^#{1,6}\s+/gm,"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/^```\w*\s*$/gm,"").trim();

function botBubble(text, o = {}){

function addTools(w, text, last, turn){

  mk("복사", () => copy(plain(text)), "primary");

  if (last) FOLLOWUPS.forEach(f => mk(f, () => submit(f, f==="브랜드 검수해줘" ? "audit" : null)));

function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.append(d); setTimeout(()=>d.remove(), 2000); }
async function copy(t){

  catch{ const ta=document.createElement("textarea"); ta.value=t; document.body.append(ta); ta.select(); try{ document.execCommand("copy"); toast("복사했어요"); }catch{ toast("길게 눌러 직접 복사해 주세요"); } ta.remove(); }
}

async function makePlan(btn){
  if (!S.db || !S.uid){ toast("로그인해서 열어야 계획을 저장할 수 있어요"); return; }
  if (!await getSample()) { toast("AI 연결이 필요해요"); return; }
  btn.disabled = true; btn.textContent = "계획 만드는 중… (30초 안팎)";
  try{
    const prompt = RULES(S.standard, S.branch||"", todayLong()) + `\n\n[작업] 오늘(${today()})부터 28일 동안의 콘텐츠 계획을 만듭니다. 네이버 블로그는 매일 1편(지역 키워드를 돌려 가며), 인스타그램 주 3회, 스레드 주 2회, 네이버 플레이스 소식 주 1회, 재원생 카톡 소식 주 1회. 시즌 이벤트와 주 1회 '아이 변화 사례'를 넣으세요.\nJSON 배열로만 답하세요. 각 항목: {"date":"YYYY-MM-DD","channel":"네이버 블로그|인스타그램|스레드|네이버 플레이스|카카오톡","title":"구체적인 글 제목","goal":"신규 문의|재등록|소개"}. 예: [{"date":"${today()}","channel":"네이버 블로그","title":"아름동 피아노학원, 겨울방학에 시작하면 좋은 이유","goal":"신규 문의"}]`;
    const arr = await S.sample.json(prompt, { cache:false });
    if (!Array.isArray(arr) || !arr.length) throw { code:"invalid_json" };
    const items = arr.filter(p => p && /^\d{4}-\d{2}-\d{2}$/.test(String(p.date)) && p.title).slice(0, 80);
    await ensureWs();
    // 같은 기간의 기존 미완료 계획은 교체
    const old = S.posts.filter(p => !p.done && p.date >= today());
    for (const p of old) await postsCol().doc(p.id).delete();
    await Promise.all(items.map(p => postsCol().add({ date:String(p.date), channel:String(p.channel||"네이버 블로그"), title:String(p.title).slice(0,120), goal:String(p.goal||""), done:false })));
    toast(`4주 콘텐츠 ${items.length}개를 계획에 넣었어요`);
  }catch(e){ toast(e && e.code==="not_granted" ? "AI 사용이 허락되지 않았어요" : "계획을 만들지 못했어요. 다시 눌러 주세요."); }
  finally{ if (btn.isConnected){ btn.disabled = false; btn.textContent = "📅 앞으로 4주 콘텐츠 계획 만들기"; } }
}

   11. 이벤트 연결

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.tab) return go(d.tab);
  if (d.mode) return pickMode(d.mode);
  if (d.lf){ S.leadFilter = d.lf; return renderLeads(); }
  if (d.todo) return doTodo(d.todo, d.id);
  if (d.diag){ const l = S.leads.find(x=>x.id===d.diag); go("chat"); setMode("diag"); $("input").value = `아이: ${l.who} (${l.age||""})\n관찰한 것: \n부모님이 바라는 것: ${l.concern||""}`; autoGrow(); $("input").focus(); return; }
  if (d.tostudent){ const l = S.leads.find(x=>x.id===d.tostudent);
    return write(async()=>{ await stuCol().add({ who:l.who.replace(/\s*(어머님|아버님|부모님)$/,""), grade:l.age||"", level:"", since:monthKey(), memo:l.concern||"", status:"재원", risk:"안정", lastReport:"" }); await leadsCol().doc(l.id).update({toStudent:true}); }, "재원생 목록에 추가했어요"); }
  if (d.dellead) return confirmTwice(b, () => write(()=>leadsCol().doc(d.dellead).delete(), "삭제했어요"));
  if (d.sent) return markSent(d.sent);
  if (d.leave) return confirmTwice(b, () => write(()=>stuCol().doc(d.leave).update({status:"퇴원", leftAt:today()}), "퇴원 처리했어요"));
  if (d.back) return write(()=>stuCol().doc(d.back).update({status:"재원", leftAt:""}), "복귀 처리했어요");
  if (d.delstu) return confirmTwice(b, () => write(()=>stuCol().doc(d.delstu).delete(), "삭제했어요"));
  switch (d.act){
    case "diagnose": { const st = stats(); go("chat"); setMode("diagnose");
      return submit(`${branchName()} 이번 달(${monthKey()}) 숫자입니다.\n- 문의 ${st.leads} / 상담 ${st.consults} / 등록 ${st.enrolled} / 전환율 ${st.conv??"–"}%\n- 재원생 ${st.active} / 이번 달 퇴원 ${st.left} / 유지율 ${st.retention??"–"}%\n- 리포트 밀린 아이 ${st.reportsDue}명\n- 채널별(문의/등록): ${Object.entries(st.byChannel).map(([c,v])=>`${c} ${v.leads}/${v.enrolled}`).join(", ")||"기록 없음"}`, "diagnose"); }
    case "hq-diag": { const mk = monthKey(); const lines = S.kpiAll.filter(k=>(k.months||{})[mk]).map(k=>{ const m=k.months[mk]; return `- ${k.branch}: 문의 ${m.leads}, 등록 ${m.enrolled}, 재원 ${m.active}, 퇴원 ${m.left}`; });
      go("chat"); setMode("diagnose"); return submit(`전 지점 ${mk} 숫자입니다. 본사 관점에서 지점 간 차이, 잘하는 지점의 방식을 다른 지점에 퍼뜨릴 방법, 도움이 필요한 지점과 본사 지원책을 진단해 주세요.\n${lines.join("\n")}`, "diagnose"); }
    case "report-hq": return reportHQ();
    case "plan": return makePlan(b);
    case "new-chat": if (S.ctl) S.ctl.abort(); S.turns = []; local.set("turns", []); setMode(null); return renderChat();
    case "save-std": { const v = $("stdText").value.trim() || DEFAULT_STANDARD; return write(()=>S.db.doc("brand/standard").set({ text:v, updatedAt:new Date().toLocaleString("ko-KR") }), "브랜드 표준을 저장했어요 · 모든 지점에 적용돼요"); }
    case "reset-std": $("stdText").value = DEFAULT_STANDARD; return;
    case "save-branch": { const v = $("branchText").value.trim(); S.branch = v; local.set("branch", v);
      if (S.db && S.uid) return write(async()=>{ await ensureWs(); await ws().update({ card:v }); }, "지점 카드를 저장했어요");
      return toast("이 기기에 저장했어요"); }
  }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.stage){ const l = S.leads.find(x=>x.id===d.stage); const patch = { stage:t.value, next:stageNext(t.value, l.next) };
    if (t.value === "등록") patch.enrolledAt = today();
    write(()=>leadsCol().doc(d.stage).update(patch), t.value==="등록" ? "등록 축하해요! '재원생으로 추가'를 눌러 주세요" : `다음 연락일을 ${patch.next? patch.next.slice(5).replace("-","/") : "없음"}(으)로 잡았어요`); }
  if (d.next) write(()=>leadsCol().doc(d.next).update({ next:t.value }));
  if (d.risk) write(()=>stuCol().doc(d.risk).update({ risk:t.value }), t.value==="위험" ? "오늘 할 일에 올렸어요" : null);
  if (d.post) write(()=>postsCol().doc(d.post).update({ done:t.checked }));
});
document.addEventListener("submit", async e => {
  if (e.target.id === "form"){ e.preventDefault(); return submit(); }
  if (e.target.id === "leadForm"){ e.preventDefault();
    const v = id => $(id).value.trim();
    const ok = await write(async()=>{ await ensureWs(); await leadsCol().add({ who:v("lf-who"), age:v("lf-age"), channel:$("lf-ch").value, concern:v("lf-con"), memo:v("lf-memo"), stage:"문의", next:$("lf-next").value||today(), createdAt:today() }); }, "문의를 기록했어요");
    if (ok) e.target.reset(); }
  if (e.target.id === "stuForm"){ e.preventDefault();
    const v = id => $(id).value.trim();
    const ok = await write(async()=>{ await ensureWs(); await stuCol().add({ who:v("sf-who"), grade:v("sf-grade"), level:v("sf-level"), since:v("sf-since"), memo:v("sf-memo"), status:"재원", risk:"안정", lastReport:"" }); }, "재원생을 추가했어요");
    if (ok) e.target.reset(); }
});

function doTodo(kind, id){
  if (kind === "lead"){ const l = S.leads.find(x=>x.id===id); if (!l) return; go("chat"); setMode("followup");
    return submit(`상담 건: ${l.who} (${l.age||"나이 미상"})\n알게 된 경로: ${l.channel||""}\n현재 단계: ${l.stage}\n문의일: ${l.createdAt||""}\n걱정·바라는 것: ${l.concern||"-"}\n메모: ${l.memo||"-"}`, "followup"); }
  if (kind === "rep"){ const s = S.students.find(x=>x.id===id); if (!s) return; go("chat"); setMode("report"); S.pendingStudent = s.id;
    $("input").value = `아이: ${s.who} (${s.grade||""}, ${s.level||""})${s.memo?`\n참고: ${s.memo}`:""}\n이번 주 배운 것: \n좋아진 점: \n아직 어려워하는 점: \n다음 목표: `; autoGrow();
    const i = $("input"); const p = i.value.indexOf("이번 주 배운 것: ") + "이번 주 배운 것: ".length; i.focus(); i.setSelectionRange(p,p); return; }
  if (kind === "risk"){ const s = S.students.find(x=>x.id===id); if (!s) return; go("chat"); setMode("retention");
    return submit(`아이: ${s.who} (${s.grade||""}, ${s.level||""}, ${s.since||"?"}부터 다님)\n상황: ${s.memo||"퇴원 위험 신호가 보임"}\n먼저 연락해서 마음을 확인하려고 합니다.`, "retention"); }
  if (kind === "post"){ const p = S.posts.find(x=>x.id===id); if (!p) return;
    const m = {"네이버 블로그":"blog","인스타그램":"insta","스레드":"threads","네이버 플레이스":"place","카카오톡":"notice"}[p.channel] || "blog";
    go("chat"); setMode(m); return submit(`주제: ${p.title}\n목적: ${p.goal||""}`, m); }
}

/* =====================================================================
   12. AI 대화
   ===================================================================== */
const input = $("input");
function pickMode(id){
  const m = MODES[id]; go("chat"); setMode(id);
  if (m.send) return submit(m.send, id);
  input.value = m.tpl || ""; autoGrow(); input.focus();
  const p = input.value.indexOf(": "); if (p > -1) input.setSelectionRange(p+2, p+2);
  if (id === "photo" && S.canImages) $("file").click();
}
function setMode(id){ S.mode = id; $("modeBar").hidden = !id; if (id) $("modeName").textContent = MODES[id].e+" "+MODES[id].n; }
function buildInput(){
  const head = { role:"user", content: RULES(S.standard, S.branch || (S.isOwner?MAIN_BRANCH:BLANK_BRANCH), todayLong()) + "\n\n원장님이 곧 부탁을 드립니다. 위 규칙을 계속 지켜 주세요." };
  const recent = S.turns.slice(-12).map(t => ({ role:t.role, content:t.content }));
  while (recent.length && recent[0].role === "assistant") recent.shift();
  return [head, ...recent];
}
async function getSample(){
  if (S.sample) return S.sample;
  if (S.sample === false || !window.claude?.use) return null;
  S.sample = (await window.claude.use("sample")) || false; return S.sample || null;
}
async function submit(text, modeId){
  text = (text ?? input.value).trim();
  if (!text || S.busy) return;
  const mid = modeId !== undefined && modeId !== null ? modeId : S.mode;
  const m = mid ? MODES[mid] : null;
  const content = (m ? `[작업: ${m.n}]\n작업 지침:\n${m.g}\n\n` : "") + `원장님 요청:\n${text}`;
  const turn = { role:"user", content, show:text, mode:mid };
  const studentId = mid === "report" ? S.pendingStudent : null; S.pendingStudent = null;
  if (S.sample === false || !window.claude?.use){
    copy(buildInput().map(t=>t.content).join("\n\n") + "\n\n" + content); toast("완성 프롬프트를 복사했어요 — Claude에 붙여 넣으세요"); return;
  }
  if (S.tab !== "chat") go("chat");
  S.turns.push(turn); local.set("turns", S.turns.slice(-30));
  input.value = ""; autoGrow(); setMode(null);
  const v = $("v-chat");
  v.querySelectorAll(".msg.bot .tools").forEach(t => [...t.children].forEach(c => { if (FOLLOWUPS.includes(c.textContent)) c.remove(); }));
  v.append(userBubble(turn));
  const w = botBubble("", {thinking:true}); v.append(w); scrollDown();
  const tools = w.querySelector(".tools"), body = w.querySelector(".md");
  const stop = document.createElement("button"); stop.type="button"; stop.className="btn"; stop.textContent="그만 쓰기"; tools.append(stop);
  S.busy = true; $("send").disabled = true; S.ctl = new AbortController(); stop.onclick = () => S.ctl.abort();
  const imgs = S.attached ? [S.attached] : undefined; clearAttach();
  try{
    const sample = await getSample(); if (!sample) throw { code:"not_granted" };
    const opts = { cache:false, signal:S.ctl.signal, onText: ({text}) => { body.innerHTML = md(text); scrollDown(); } };
    if (imgs) opts.images = imgs;
    const res = await sample(buildInput(), opts);
    const at = { role:"assistant", content:res.text, studentId };
    S.turns.push(at); local.set("turns", S.turns.slice(-30));
    body.innerHTML = md(res.text); addTools(w, res.text, true, at);
    if (res.truncated) tools.insertAdjacentHTML("beforeend", `<span class="note">길어서 끊겼어요. "이어서 써줘"라고 보내 주세요.</span>`);
  }catch(e){
    const kept = e && e.text;
    if (kept){ const at = { role:"assistant", content:kept, studentId }; S.turns.push(at); local.set("turns", S.turns.slice(-30)); body.innerHTML = md(kept); addTools(w, kept, true, at); }
    else { body.innerHTML = ""; tools.innerHTML = ""; }
    if (!e || e.code !== "cancelled") body.insertAdjacentHTML("beforeend", `<p class="err">${errText(e && e.code)}</p>`);
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")){ S.sample = false; aiNote(); }
    if (!kept){ const r = document.createElement("button"); r.type="button"; r.className="btn"; r.textContent="다시 시도";
      r.onclick = () => { S.turns.pop(); local.set("turns", S.turns); w.previousElementSibling.remove(); w.remove(); S.pendingStudent = studentId; submit(text, mid); }; tools.append(r); }
  }finally{ S.busy = false; $("send").disabled = false; stop.remove(); }
}
function errText(code){
  return ({ not_granted:"AI 사용이 허락되지 않았어요. 페이지 권한 메뉴에서 허락하시거나, 보내기를 누르면 프롬프트가 복사돼요.",
    sampling_disabled:"이 계정에서는 Claude를 쓸 수 없어요.", rate_limited:"잠깐 요청이 많았어요. 1~2분 뒤에 다시 보내 주세요.",
    session_expired:"로그인이 풀렸어요. 다시 로그인해 주세요.", refused:"이 요청은 쓸 수 없었어요. 표현을 바꿔 주세요.",
    prompt_too_large:"대화가 너무 길어요. '새 대화 시작'을 눌러 주세요.", image_rejected:"이 사진은 쓸 수 없어요. JPG·PNG로 올려 주세요.",
    empty_completion:"답이 비어 있었어요. 조금 더 구체적으로 부탁해 주세요." })[code] || "연결이 잠깐 끊겼어요. '다시 시도'를 눌러 주세요.";
}
function autoGrow(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, innerHeight*0.38) + "px"; }
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", e => { if (e.key==="Enter" && !e.shiftKey && !e.isComposing && matchMedia("(min-width:700px)").matches){ e.preventDefault(); submit(); } });
$("modeClear").onclick = () => setMode(null);
$("btnPhoto").onclick = () => $("file").click();
$("file").onchange = e => { const f = e.target.files && e.target.files[0]; if (!f) return; S.attached = f; $("thumb").src = URL.createObjectURL(f); $("attachRow").hidden = false; if (!S.mode) setMode("photo"); e.target.value = ""; };
function clearAttach(){ S.attached = null; $("attachRow").hidden = true; }
$("attachClear").onclick = clearAttach;

/* 보관함 */
function renderArchive(){
  const list = $("archList");
  if (!S.archive.length){ list.innerHTML = `<p class="note">아직 보관한 글이 없어요. 답변 아래 '보관'을 눌러 보세요.</p>`; return; }
  list.innerHTML = S.archive.map(a => `<div class="arch-item"><b>${esc(a.t)}</b><span class="note">${esc(new Date(a.at).toLocaleString("ko-KR"))}</span><pre>${esc(a.text)}</pre>
    <div class="row"><button class="btn primary" type="button" data-copyarch="${esc(a.id)}">복사</button><button class="btn" type="button" data-delarch="${esc(a.id)}">삭제</button></div></div>`).join("");
}
$("archList").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; e.stopPropagation();
  if (b.dataset.copyarch){ const a = S.archive.find(x=>x.id===b.dataset.copyarch); if (a) copy(a.text); }
  if (b.dataset.delarch) confirmTwice(b, () => write(()=>archCol().doc(b.dataset.delarch).delete(), "삭제했어요"));
});
$("btnArchive").onclick = () => { renderArchive(); $("archSheet").hidden = false; };
$("archClose").onclick = () => $("archSheet").hidden = true;
$("archSheet").addEventListener("click", e => { if (e.target.id === "archSheet") $("archSheet").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("archSheet").hidden = true; });

/* =====================================================================
   13. 시작 — 권한 확인 · 데이터 구독(한 번만)
   ===================================================================== */
S.branch = local.get("branch", null);
go(S.tab);
(async () => {
  if (!window.claude?.use){ S.sample = false; S.dbState = "off"; go(S.tab); return; }
  const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
  S.user = user;
  if (user){
    S.isOwner = await user.isOwner().catch(()=>false);
    S.isAdmin = S.isOwner || await user.canEdit().catch(()=>false);
    S.uid = await user.id().catch(()=>null);
    const w = await user.can("data.write").catch(()=>null); S.canWrite = w !== false;
  }
  if (!db || !S.uid){ S.dbState = "off"; go(S.tab); }
  else {
    S.db = db; S.dbState = "loading";
    const slow = setTimeout(() => { if (S.dbState === "loading"){ S.dbState = "slow"; refresh(); } }, 10000);
    const ok = snap => { if (!snap.metadata.fromCache){ clearTimeout(slow); if (S.dbState !== "ok"){ S.dbState = "ok"; } } };
    const fail = () => { clearTimeout(slow); S.dbState = "slow"; refresh(); };
    const listOf = snap => snap.docs.map(d => ({ id:d.id, ...d.data() }));
    db.doc("brand/standard").onSnapshot(s => { ok(s); if (s.exists && s.data().text) S.standard = s.data().text; refresh(); }, fail);
    ws().onSnapshot(s => { ok(s); if (s.exists && s.data().card){ S.branch = s.data().card; local.set("branch", S.branch); } refresh(); $("kicker").textContent = branchName() + " · 운영 시스템"; }, fail);
    leadsCol().onSnapshot(s => { ok(s); S.leads = listOf(s); refresh(); }, fail);
    stuCol().onSnapshot(s => { ok(s); S.students = listOf(s); refresh(); }, fail);
    postsCol().orderBy("date").onSnapshot(s => { ok(s); S.posts = listOf(s); refresh(); }, fail);
    archCol().orderBy("at","desc").limit(200).onSnapshot(s => { ok(s); S.archive = listOf(s); if (!$("archSheet").hidden) renderArchive(); }, fail);
    db.doc(`kpi/${S.uid}`).onSnapshot(s => { S.myKpi = s.exists ? s.data() : null; refresh(); }, () => {});
    if (S.isAdmin) db.collection("kpi").onSnapshot(s => { S.kpiAll = listOf(s); refresh(); }, () => {});
  }
  // AI · 사진 · 음성
  try{
    const s = await window.claude.use("sample"); S.sample = s || false; aiNote();
    if (s){ const lim = await s.limits().catch(()=>null); S.canImages = !!(lim && lim.images); $("btnPhoto").hidden = !S.canImages; if (S.canImages) $("file").accept = lim.images.mediaTypes.join(","); }
  }catch{ S.sample = false; aiNote(); }
  try{
    const d = await window.claude.use("dictation");
    if (d){ const mic = $("btnMic"); mic.hidden = false; let base = "";
      d.onPartial(({text}) => { input.value = base + text; autoGrow(); });
      d.onFinal(({text}) => { base = base + text + " "; input.value = base; autoGrow(); });
      d.onState(({state}) => mic.classList.toggle("on", state === "listening"));
      mic.onclick = () => { if (mic.classList.contains("on")){ d.stop().catch(()=>{}); return; } base = input.value ? input.value + " " : ""; d.start().catch(e => { if (e && e.code === "not_granted") mic.hidden = true; }); };
    }
  }catch{}
  go(S.tab);
})();
</script>
