<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피아노학원</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<!--
  ==========================================================
  ✏️ 원장님 편집 안내
  1) 아래 <script> 안의 CONFIG 부분만 바꾸시면 사이트 전체에 반영됩니다.
     (학원명·지역·원장 이름은 블로그 글 속 {학원명} {지역} {원장} 자리에도 자동으로 들어갑니다)
  2) 블로그 글은 POSTS 목록에 { ... } 덩어리 하나를 복사해 붙이면 추가됩니다.
     본문 규칙:  ## 소제목  /  - 목록  /  **굵게**  /  빈 줄 = 문단 나누기
  3) 사진은 class="ph" 회색 박스를 <img src="사진주소" alt="설명"> 로 바꾸시면 됩니다.
  ==========================================================
-->
<style>
:root{
  --cream:#FAF6EE; --cream-2:#F2EBDD; --paper:#FFFFFF;
  --navy:#1F2A44; --navy-2:#34405E; --ink:#2B2B2B; --muted:#6B6558;
  --gold:#B8935A; --line:#E4DACA; --kakao:#FEE500;
  --radius:18px; --wrap:1080px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:18px;line-height:1.8;color:var(--ink);background:var(--cream);
  padding-bottom:88px;word-break:keep-all;overflow-wrap:break-word}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:"Noto Serif KR",serif;color:var(--navy);line-height:1.4;font-weight:700}

/* 헤더 */
header{position:sticky;top:0;z-index:50;background:rgba(250,246,238,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:"Noto Serif KR",serif;font-weight:700;font-size:21px;color:var(--navy);text-decoration:none}
.logo small{display:block;font-family:"Noto Sans KR",sans-serif;font-size:12px;color:var(--muted);font-weight:400;line-height:1.2}
.menu-btn{background:none;border:0;font-size:16px;color:var(--navy);padding:10px 4px;cursor:pointer;font-weight:500}
nav.gnb{display:none;position:absolute;left:0;right:0;top:64px;background:var(--cream);
  border-bottom:1px solid var(--line);padding:8px 20px 16px}
nav.gnb.open{display:block}
nav.gnb a{display:block;padding:14px 4px;font-size:18px;text-decoration:none;border-bottom:1px solid var(--line);color:var(--navy)}
nav.gnb a:last-child{border:0}

/* 공통 섹션 */
section{padding:72px 0}
section.alt{background:var(--paper)}
.eyebrow{display:inline-block;font-size:14px;letter-spacing:.12em;color:var(--gold);font-weight:700;margin-bottom:10px}
.sec-title{font-size:28px;margin-bottom:14px}
.sec-lead{color:var(--muted);margin-bottom:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 28px;
  border-radius:999px;font-size:18px;font-weight:700;text-decoration:none;border:0;cursor:pointer}
.btn-navy{background:var(--navy);color:#fff}
.btn-line{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn-kakao{background:var(--kakao);color:#3A1D1D}
.ph{background:#D9D9D9;color:#666;display:flex;align-items:center;justify-content:center;text-align:center;
  border-radius:var(--radius);font-size:16px;min-height:200px;padding:16px;border:2px dashed #BDBDBD}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px 24px}
.grid{display:grid;gap:18px}

/* 메인 */
.hero{padding:44px 0 64px}
.hero .ph{min-height:240px;margin-bottom:32px}
.hero h1{font-size:32px;margin-bottom:16px}
.hero p.lead{font-size:19px;color:var(--navy-2);margin-bottom:28px}
.hero .btns{display:flex;flex-direction:column;gap:12px}
.strength .num{font-family:"Noto Serif KR",serif;color:var(--gold);font-size:30px;line-height:1;margin-bottom:12px}
.strength h3{font-size:21px;margin-bottom:8px}
.strength p{color:var(--muted)}

/* 원장 */
.about-grid{display:grid;gap:28px}
.about-grid .ph{min-height:320px}
.quote{font-family:"Noto Serif KR",serif;font-size:21px;color:var(--navy);border-left:4px solid var(--gold);
  padding:4px 0 4px 18px;margin:20px 0 28px;line-height:1.7}
.career{list-style:none;margin-bottom:28px}
.career li{padding:10px 0 10px 22px;border-bottom:1px solid var(--line);position:relative}
.career li::before{content:"♪";position:absolute;left:0;color:var(--gold)}
.letter{background:var(--cream);border-radius:var(--radius);padding:28px 24px}
.letter h3{font-size:20px;margin-bottom:12px}
.letter p+p{margin-top:14px}
.letter .sign{text-align:right;margin-top:18px;font-family:"Noto Serif KR",serif;color:var(--navy)}

/* 수업 */
.course .age{display:inline-block;background:var(--cream-2);color:var(--navy);font-size:15px;font-weight:700;
  padding:4px 14px;border-radius:999px;margin-bottom:12px}
.course h3{font-size:21px;margin-bottom:8px}
.course p{color:var(--muted);margin-bottom:12px}
.course ul{padding-left:20px}
.sub-title{font-size:22px;margin:56px 0 18px}
.method li{list-style:none;padding:16px 0;border-bottom:1px solid var(--line)}
.method b{color:var(--navy);display:block;font-size:19px}
.flow{counter-reset:step;display:grid;gap:14px}
.flow li{list-style:none;counter-increment:step;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:20px 20px 20px 76px;position:relative}
.flow li::before{content:counter(step);position:absolute;left:20px;top:20px;width:40px;height:40px;border-radius:50%;
  background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.flow b{color:var(--navy);font-size:19px;display:block}
.fac-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.fac-grid .ph{min-height:140px;font-size:14px}
.fac-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.fac-list span{background:var(--cream-2);padding:6px 16px;border-radius:999px;font-size:16px;color:var(--navy)}

/* 블로그 */
.post-card{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;transition:transform .15s, box-shadow .15s}
.post-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(31,42,68,.08)}
.post-card .ph{border-radius:0;border:0;min-height:170px;font-size:15px}
.post-card .body{padding:22px 22px 26px}
.post-card .cat{font-size:14px;color:var(--gold);font-weight:700}
.post-card h3{font-size:20px;margin:6px 0 10px}
.post-card p{color:var(--muted);font-size:16px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-card .more{display:inline-block;margin-top:12px;color:var(--navy);font-weight:700;font-size:16px}

/* 블로그 상세 */
.article{padding:36px 0 64px}
.article .wrap{max-width:760px}
.back{display:block;margin-bottom:24px;color:var(--navy);text-decoration:none;font-weight:500}
.article .cat{color:var(--gold);font-weight:700;font-size:15px}
.article h1{font-size:28px;margin:8px 0 12px}
.article .meta{color:var(--muted);font-size:15px;padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:28px}
.article .ph{min-height:220px;margin-bottom:32px}
.content{font-size:19px;line-height:1.95}
.content p{margin-bottom:22px}
.content h2{font-size:23px;margin:44px 0 16px;padding-top:4px}
.content h2::before{content:"";display:block;width:32px;height:3px;background:var(--gold);margin-bottom:14px}
.content ul{margin:0 0 22px 22px}
.content li{margin-bottom:8px}
.content strong{color:var(--navy)}
.cta-box{background:var(--navy);color:#fff;border-radius:var(--radius);padding:30px 24px;margin-top:44px;text-align:center}
.cta-box p{margin-bottom:18px;font-size:18px}
.cta-box .btns{display:flex;flex-direction:column;gap:10px}
.cta-box .btn-line{color:#fff;border-color:#fff}
.others{margin-top:48px}
.others h3{font-size:20px;margin-bottom:12px}
.others a{display:block;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--navy)}

/* 후기 */
.review-slot{border:2px dashed var(--gold);background:var(--cream);border-radius:var(--radius);
  padding:32px 20px;text-align:center;color:var(--muted)}
.review-slot b{display:block;color:var(--navy);font-size:19px;margin-bottom:6px}

/* 오시는 길 */
.info-row{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.info-row dt{flex:0 0 88px;font-weight:700;color:var(--navy)}
.info-row dd a{color:var(--navy);font-weight:500}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:4px 0}
.hours td:first-child{width:96px;color:var(--muted)}
.contact-btns{display:flex;flex-direction:column;gap:12px;margin-top:28px}
#contact .ph{min-height:260px;margin-top:28px}

footer{background:var(--navy);color:#C9CFDD;padding:40px 0;font-size:15px;line-height:1.9}
footer b{color:#fff;font-family:"Noto Serif KR",serif;font-size:18px}

/* 하단 고정 버튼 */
.fixed-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.fixed-bar a{flex:1;min-height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:18px;font-weight:700;text-decoration:none}
.fixed-bar .call{background:var(--navy);color:#fff}
.fixed-bar .kakao{background:var(--kakao);color:#3A1D1D}

/* 태블릿·PC */
@media (min-width:760px){
  body{font-size:19px}
  .menu-btn{display:none}
  nav.gnb{display:flex !important;position:static;padding:0;border:0;background:none;gap:4px}
  nav.gnb a{border:0;padding:8px 12px;font-size:16px}
  section{padding:100px 0}
  .sec-title{font-size:36px}
  .hero{padding:64px 0 96px}
  .hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
  .hero .ph{order:2;margin:0;min-height:420px}
  .hero h1{font-size:44px}
  .hero .btns{flex-direction:row}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .about-grid{grid-template-columns:360px 1fr;gap:56px;align-items:start}
  .fac-grid{grid-template-columns:repeat(4,1fr)}
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
  #contact .ph{margin-top:0;min-height:420px}
  .contact-btns{flex-direction:row;flex-wrap:wrap}
  .article h1{font-size:36px}
  .cta-box .btns{flex-direction:row;justify-content:center}
  .fixed-bar{left:auto;right:24px;bottom:24px;width:360px;border-radius:20px;border:1px solid var(--line)}
  body{padding-bottom:0}
}
</style>
</head>
<body>

<header>
  <div class="wrap head">
    <a href="#top" class="logo" id="logo"></a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="gnb">메뉴 ☰</button>
    <nav class="gnb" id="gnb">
      <a href="#about">원장 소개</a>
      <a href="#lessons">수업 안내</a>
      <a href="#blog">블로그</a>
      <a href="#reviews">학부모 후기</a>
      <a href="#contact">오시는 길</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

<div class="fixed-bar" id="fixedBar"></div>

<script>
/* =========================================================
   ✏️ 1. 학원 정보 (여기만 바꾸시면 사이트 전체가 바뀝니다)
   ========================================================= */
const CONFIG = {
  학원명: "○○피아노학원",

  원장: "○○○",

  메인문구: "{지역} 아이들의\n첫 피아노 선생님이 되겠습니다",

  // 강점 3가지 (초안입니다 — 실제 학원 모습에 맞게 고쳐 주세요)
  강점: [
    { 제목: "원장 직강 1:1 레슨", 설명: "원장이 직접 아이 옆에 앉아 손 모양부터 소리까지 하나하나 살핍니다." },
    { 제목: "아이 속도에 맞춘 진도", 설명: "정해진 진도표보다 아이의 이해와 손의 준비를 먼저 봅니다." },
    { 제목: "학부모님과의 꾸준한 소통", 설명: "무엇을 배웠고 어디를 어려워하는지 정기적으로 알려 드립니다." }
  ],

  원장경력: [

    "(예) 피아노 지도 경력 ○○년",
    "(예) ○○ 콩쿠르 심사 / 지도 경험",
    "(예) 현) " + "○○피아노학원 원장"
  ],
  교육철학: "피아노는 빨리 가는 것보다 오래 즐기는 것이 더 중요하다고 믿습니다.",
  인사말: [

    "처음 학원 문을 여는 아이들의 얼굴에는 설렘과 긴장이 함께 담겨 있습니다. 저는 그 작은 손이 건반 위에서 자신감을 찾아가는 순간을 가장 좋아합니다.",
    "진도를 서두르기보다 바른 손 모양과 고운 소리, 그리고 음악을 좋아하는 마음을 먼저 키워 주고 싶습니다. 부모님께서 믿고 맡겨 주시는 만큼, 아이 한 명 한 명을 제 아이처럼 살피겠습니다.",
    "궁금하신 점이 있으면 언제든 편하게 연락 주세요. 감사합니다."
  ],

  대상: "6세 ~ 초등 6학년, 성인반",
  커리큘럼: [
    { 대상: "6~7세", 이름: "유아 기초반", 설명: "리듬 놀이와 노래로 건반과 친해지는 시간", 내용: ["바른 자세·손 모양 익히기", "음이름·기초 리듬", "동요 반주와 쉬운 곡"] },
    { 대상: "초등 1~3학년", 이름: "초등 기본반", 설명: "악보를 스스로 읽는 힘을 기르는 단계", 내용: ["바이엘 → 체르니 100 단계별", "기초 이론·시창", "소곡집으로 표현력 익히기"] },
    { 대상: "초등 4~6학년", 이름: "초등 심화반", 설명: "테크닉과 음악적 표현을 함께 다지는 단계", 내용: ["체르니 30·40 단계별", "소나티네·소나타", "희망 시 콩쿠르·연주회 준비"] },
    { 대상: "성인", 이름: "성인 취미반", 설명: "좋아하는 곡 한 곡을 끝까지 연주하는 기쁨", 내용: ["처음부터 차근차근 기초", "가요·OST·클래식 원하는 곡", "개인 일정에 맞춘 레슨"] }
  ],
  수업방식: [
    { 제목: "1:1 개인 레슨", 설명: "선생님과 마주 앉아 아이의 손과 소리를 직접 확인합니다." },
    { 제목: "개별 연습", 설명: "배운 내용을 개별 연습실에서 스스로 익히고, 선생님이 연습 방법을 점검합니다." },
    { 제목: "이론 수업", 설명: "음표·박자·셈여림 등 악보를 혼자 읽을 수 있는 기초를 다집니다." }
  ],
  레슨흐름: [
    { 제목: "인사와 손 풀기", 설명: "오늘 기분을 묻고, 손가락 체조와 스케일로 손을 풉니다." },
    { 제목: "1:1 레슨", 설명: "지난 곡 점검 → 칭찬과 교정 → 새 곡 함께 읽기" },
    { 제목: "개별 연습 · 이론", 설명: "배운 부분을 혼자 연습하고, 수준에 맞는 이론을 익힙니다." },
    { 제목: "기록과 마무리", 설명: "오늘 배운 것과 집에서 연습할 부분을 기록해 둡니다." }
  ],
  시설: ["(예) 그랜드피아노", "(예) 개별 연습실 ○개", "(예) 정기 조율 관리", "(예) 대기 공간"],

  운영시간: [
    ["평일", "오후 1:00 ~ 오후 8:00"],
    ["토요일", "오전 10:00 ~ 오후 3:00"],
    ["일·공휴일", "휴무"]
  ],
  주소: "○○시 ○○동 ○○로 00, ○층",
  주소안내: "(예) ○○초등학교 정문 맞은편 건물 ○층",
  전화: "010-0000-0000",
  카카오: "https://pf.kakao.com/",        // 카카오톡 채널 주소로 바꿔 주세요
  네이버플레이스: "https://map.naver.com/" // 네이버 플레이스 주소로 바꿔 주세요
};

/* =========================================================
   ✏️ 2. 블로그 글 (새 글은 맨 위에 { ... }, 하나를 추가하세요)
   ========================================================= */
const POSTS = [
{
  id: "academy-checklist",

레슨을 마치면 오늘 무엇을 배웠는지, 집에서 어떤 부분을 연습하면 좋을지 간단히 기록해 둡니다. 부모님께서도 아이의 배움을 함께 보실 수 있도록 레슨 내용을 정기적으로 전해 드리고 있어요. 아이가 "오늘 이 부분 잘했다!"라는 칭찬 한마디를 안고 즐겁게 문을 나서는 것, 그것이 제가 매일 바라는 레슨의 마무리입니다.

물론 아이의 나이와 단계에 따라 순서와 비중은 조금씩 달라집니다. 유아반 아이들은 놀이 시간이 더 길고, 고학년 아이들은 곡 연습과 표현에 더 많은 시간을 씁니다.

우리 아이에게 맞는 레슨 방식이 궁금하시다면, 상담 때 직접 보여 드릴게요.

/* =========================================================
   ⚙️ 아래부터는 화면을 그리는 코드입니다 (수정하지 않으셔도 됩니다)

const C = CONFIG;
const fill = s => String(s).replace(/\{학원명\}/g, C.학원명).replace(/\{지역\}/g, C.지역).replace(/\{원장\}/g, C.원장);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const t = s => esc(fill(s));
const tel = "tel:" + C.전화.replace(/[^0-9+]/g, "");
const ph = label => `<div class="ph" role="img" aria-label="${label.replace(/<br>/g," ")}">📷 ${label}</div>`;

// 본문 변환: ## 소제목 / - 목록 / **굵게** / 빈 줄 = 문단
function renderBody(src){
  const inline = s => t(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return src.trim().split(/\n\s*\n/).map(block => {
    const lines = block.trim().split("\n");
    if (lines[0].startsWith("## ")) return `<h2>${inline(lines[0].slice(3))}</h2>`;
    if (lines.every(l => l.trim().startsWith("- "))) return `<ul>${lines.map(l => `<li>${inline(l.trim().slice(2))}</li>`).join("")}</ul>`;
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("\n");
}
const fmtDate = d => d.replace(/-/g, ". ") + ".";
const sorted = () => [...POSTS].sort((a,b) => b.날짜.localeCompare(a.날짜));

const ctaButtons = (cls = "") => `
  <a class="btn btn-kakao ${cls}" href="${C.카카오}" target="_blank" rel="noopener">💬 카카오톡 상담</a>
  <a class="btn btn-line ${cls}" href="${tel}">📞 전화 상담</a>`;

function postCard(p){
  return `<a class="post-card" href="#/post/${p.id}">
    ${ph("글 대표 사진 넣는 곳")}
    <div class="body">
      <span class="cat">${t(p.분류)} · ${fmtDate(p.날짜)}</span>
      <h3>${t(p.제목)}</h3>
      <p>${t(p.요약)}</p>
      <span class="more">읽어보기 →</span>
    </div></a>`;
}

function postView(p){
  const others = sorted().filter(x => x.id !== p.id).slice(0, 4);
  return `
  <article class="article">
    <div class="wrap">
      <a class="back" href="#blog">← 블로그 목록으로</a>
      <span class="cat">${t(p.분류)}</span>
      <h1>${t(p.제목)}</h1>
      <div class="meta">${t(C.학원명)} 원장 ${t(C.원장)} · ${fmtDate(p.날짜)}</div>
      ${ph("글 사진 넣는 곳")}
      <div class="content">${renderBody(p.본문)}</div>
      <div class="cta-box">
        <p>${t(C.지역)} ${t(C.학원명)}에서<br>우리 아이에게 맞는 수업을 함께 찾아보세요.</p>
        <div class="btns">${ctaButtons()}</div>
      </div>
      <div class="others"><h3>다른 글 보기</h3>${others.map(o => `<a href="#/post/${o.id}">${t(o.제목)} →</a>`).join("")}</div>
    </div>
  </article>`;
}

function setMeta(title, desc){
  document.title = title;
  document.querySelector('meta[name="description"]').setAttribute("content", desc);
}

let lastView = "";
function route(){
  const app = document.getElementById("app");
  const hash = location.hash;
  const m = hash.match(/^#\/post\/(.+)$/);
  const p = m && POSTS.find(x => x.id === decodeURIComponent(m[1]));
  if (p){
    app.innerHTML = postView(p); lastView = "post";
    setMeta(fill(p.제목) + " | " + C.학원명, fill(p.요약));
    window.scrollTo(0, 0);
  } else {
    if (lastView !== "home"){ app.innerHTML = homeView(); lastView = "home"; }
    setMeta(`${C.지역전체} 피아노학원 | ${C.학원명}`, `${C.지역전체} ${C.학원명} - ${C.한줄소개}`);
    const target = hash && hash.length > 1 && document.getElementById(hash.slice(1));
    if (target) target.scrollIntoView(); else if (!hash || hash === "#top") window.scrollTo(0, 0);
  }
  closeMenu();
}
